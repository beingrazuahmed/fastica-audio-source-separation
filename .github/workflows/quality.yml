name: Source and privacy quality checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check for private media or notebook outputs
        run: python scripts/check_public_release.py
      - name: Standard-library notebook and documentation tests
        run: python -m unittest discover -s tests -v
      - name: Compile maintenance scripts
        run: python -m compileall -q scripts tests
